<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2563eb">

  <!-- 1. Page Title & Description -->
  <title id="pageTitle">PMAY-G Portal</title>
  <meta id="pageDescription" name="description" content="PMAY-G Housing Scheme Monitoring & Compliance System">

  <!-- 2. WhatsApp / Social Media Preview (OG Tags) -->
  <meta id="ogTitle" property="og:title" content="PMAY-G Monitoring Portal">
  <meta id="ogDescription" property="og:description" content="Rural Housing Scheme Monitoring & Compliance System">
  <meta id="ogImage" property="og:image" content="/fevicon.png">

  <!-- 3. Favicon (ब्राउज़र टैब का लोगो) -->
  <link id="appFavicon" rel="icon" type="image/png" href="/fevicon.png">
  <link rel="shortcut icon" type="image/png" href="/fevicon.png">
  <link rel="apple-touch-icon" href="/fevicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #error-box {
      display: none;
      text-align: center;
      padding: 15% 20px 0 20px;
      color: #ffffff;
    }
    #error-box h2 {
      color: #ef4444;
      margin-bottom: 12px;
      font-size: 26px;
    }
    #error-box p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      color: #38bdf8;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>

  <!-- Google Apps Script App यहाँ लोड होगा -->
  <iframe id="appFrame" src="" allow="geolocation; camera; microphone"></iframe>

  <!-- गलत सबडोमेन या लिंक न होने पर एरर मैसेज -->

    <div id="subdomainInfo" class="badge"></div>
  </div>

      },

      },
      "turkaulia": {
        "title": "PMAY-G Portal | Block Turkaulia",
        "desc": "PMAY-G Rural Housing Inspection Portal for Turkaulia Block",
        "url": "https://script.google.com/macros/s/PASTE_YOUR_TURKAULIA_SCRIPT_ID/exec"
      }
    };

    // सबडोमेन निकालना (जैसे 'kesaria.ropotechnologies.com' से 'kesaria')
    const hostname = window.location.hostname.toLowerCase();
    const rawSubdomain = hostname.split('.')[0];
    const subdomain = rawSubdomain.replace(/[-_]/g, '');

    const currentBlock = blockApps[subdomain] || blockApps[rawSubdomain];

    if (currentBlock && currentBlock.url && !currentBlock.url.includes("PASTE_YOUR_")) {
      // 1. Page Title अपडेट करें
      document.title = currentBlock.title;

      // 2. Description अपडेट करें
      const descMeta = document.getElementById("pageDescription");
      if (descMeta && currentBlock.desc) {
        descMeta.setAttribute("content", currentBlock.desc);
      }

      // 3. Social Media & WhatsApp Tags अपडेट करें
      const ogTitleMeta = document.getElementById("ogTitle");
      if (ogTitleMeta) ogTitleMeta.setAttribute("content", currentBlock.title);

      const ogDescMeta = document.getElementById("ogDescription");
      if (ogDescMeta && currentBlock.desc) {
        ogDescMeta.setAttribute("content", currentBlock.desc);
      }

      const ogImgMeta = document.getElementById("ogImage");
      if (ogImgMeta) {
        // पूरा डोमेन पाथ जोड़कर WhatsApp प्रीव्यू इमेज सेट करना
        ogImgMeta.setAttribute("content", window.location.origin + "/fevicon.png");
      }

      // 4. iFrame लोड करें
      document.getElementById("appFrame").src = currentBlock.url;
    } else {
      document.getElementById("appFrame").style.display = "none";
      const errorBox = document.getElementById("error-box");
      const infoBadge = document.getElementById("subdomainInfo");
      
      infoBadge.textContent = "Requested Subdomain: " + (rawSubdomain || "None");
      errorBox.style.display = "block";
    }
  </script>
</body>
</html>
